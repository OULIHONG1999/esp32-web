# font-cloud 站点分流（插入 firmware-server.conf 的 server { } 内，放在 location / 之前）
# 与 firmware-server :8787 共存；本服务 :8788

# ---- 工具指针 / 机器描述 ----
location = /font-cloud {
    return 302 /font-bench/font-cloud;
}
location = /font-cloud.json {
    proxy_pass http://127.0.0.1:8788/font-cloud.json;
    default_type application/json;
    add_header Access-Control-Allow-Origin *;
}

# ---- 测试台 + 文档（整应用挂到 /font-bench/ 前缀，proxy 去掉前缀）----
location /font-bench/ {
    proxy_pass http://127.0.0.1:8788/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- API（与 firmware 的 /api/registry 等不冲突）----
location = /api/meta {
    proxy_pass http://127.0.0.1:8788/api/meta;
    proxy_http_version 1.1;
    add_header Access-Control-Allow-Origin *;
}
location = /api/fonts {
    proxy_pass http://127.0.0.1:8788/api/fonts;
    proxy_http_version 1.1;
    add_header Access-Control-Allow-Origin *;
}
location = /api/subset {
    proxy_pass http://127.0.0.1:8788/api/subset;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    add_header Access-Control-Allow-Origin *;
}
location /api/stats {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    add_header Access-Control-Allow-Origin *;
}

# ---- 文档 / Agent（不占用 firmware 的 /docs/ 目录与 /llms.txt）----
location = /docs/architecture.md {
    proxy_pass http://127.0.0.1:8788/docs/architecture.md;
    default_type text/markdown;
}
location = /docs/protocol.md {
    proxy_pass http://127.0.0.1:8788/docs/protocol.md;
    default_type text/markdown;
}
location = /llms-font-cloud.txt {
    proxy_pass http://127.0.0.1:8788/llms.txt;
    default_type text/plain;
}
location = /llms-full.txt {
    proxy_pass http://127.0.0.1:8788/llms-full.txt;
    default_type text/plain;
}
